[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-evidence-engine"
dynamic = ["version"]
description = "Local engine for organizing and tracing digital evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3",
    "Pillow==12.3.0", "ImageHash==4.3.2",
    "reportlab==5.0.1", "pypdf==6.19.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2", "pypdfium2==5.13.0"]

[project.scripts]
dee = "evidence_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "evidence_engine.__version__"}

[tool.setuptools.package-data]
evidence_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
